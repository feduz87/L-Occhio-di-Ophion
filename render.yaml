services:
  - type: web
    name: occhio-di-ophion-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: occhio-di-ophion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://occhio-di-ophion.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: pserv
    name: occhio-di-ophion-db
    ipAddress: 10.0.0.2
    plan: free
    postgresVersion: 15
    initialDatabase: ophion_game
